name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: make release
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SkillHanger-*.zip
          generate_release_notes: true
